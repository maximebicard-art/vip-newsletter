name: VIP Newsletter v4.0

on:
  schedule:
    - cron: '0 */2 * * *'   # Poll every 2 hours
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore item cache
        uses: actions/cache@v4
        with:
          path: item_cache.json
          key: vip-state-${{ github.run_id }}
          restore-keys: |
            vip-state-

      - name: Generate newsletter
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          SEND_EMAIL: ${{ secrets.SEND_EMAIL }}
        run: python -m vip_newsletter

      - name: Save item cache
        uses: actions/cache@v4
        with:
          path: item_cache.json
          key: vip-state-${{ github.run_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-html
          path: newsletter_*.html
