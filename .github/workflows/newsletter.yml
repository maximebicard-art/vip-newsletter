name: VIP Newsletter (v3.33)

# v3.33: Poll every 2 HOURS, send once a week.
# Why: WWD / WWD Beauty / Drapers / THR expose only 10 items each. At WWD's
# publishing volume that buffer turns over in roughly 3 hours, so a daily run
# could only ever capture ~25% of its output (measured: 25%). Polling every 2h
# stays inside that window with margin; the persistent item cache accumulates
# everything between sends.
#
# Cost: ~12 runs/day x ~1.5 min ≈ 540 min/month — inside GitHub's 2,000-min
# free tier for private repos. If minutes get tight, '0 */3 * * *' is the
# cheaper fallback (marginal against a ~3h buffer, but far better than daily).

on:
  schedule:
    - cron: '0 */2 * * *'     # every 2 hours — fetch + cache
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs write the cache at once.
concurrency:
  group: vip-newsletter
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Restore item cache
      uses: actions/cache/restore@v4
      with:
        path: item_cache.json
        key: item-cache-${{ github.run_id }}
        restore-keys: |
          item-cache-

    # Send only on the Friday 09:00 UTC run, or on a manual dispatch.
    # Every other run fetches and caches silently.
    - name: Decide whether to send
      id: send
      run: |
        DOW=$(date -u +%u)
        HOUR=$(date -u +%H)
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "flag=1" >> "$GITHUB_OUTPUT"; echo "Manual run -> SEND"
        elif [ "$DOW" = "5" ] && [ "$HOUR" = "09" ]; then
          echo "flag=1" >> "$GITHUB_OUTPUT"; echo "Friday 09:00 UTC -> SEND"
        else
          echo "flag=0" >> "$GITHUB_OUTPUT"; echo "Fetch + cache only"
        fi

    - name: Generate newsletter
      env:
        NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
        FROM_NAME: ${{ secrets.FROM_NAME }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        SENDER_NAME: ${{ secrets.SENDER_NAME }}
        SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
        COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
        COMPANY_ADDRESS: ${{ secrets.COMPANY_ADDRESS }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
        COMPANY_URL: ${{ secrets.COMPANY_URL }}
        CALENDAR_LINK: ${{ secrets.CALENDAR_LINK }}
        PREHEADER: ${{ secrets.PREHEADER }}
        SEND_EMAIL: ${{ steps.send.outputs.flag }}
        ITEM_CACHE_PATH: item_cache.json
        CACHE_RETENTION_DAYS: '10'
        SOFT_RESERVE_PCT: '0.30'      # v3.33: ~30% soft in industry news
        DEBUG_NEWSLETTER: '1'
      run: |
        python auto_newsletter_v3.33.py

    - name: Save item cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: item_cache.json
        key: item-cache-${{ github.run_id }}

    # Only keep artifacts from send runs — 12 uploads/day is just noise.
    - name: Upload generated newsletter
      if: steps.send.outputs.flag == '1'
      uses: actions/upload-artifact@v4
      with:
        name: newsletter-${{ github.run_id }}
        path: |
          newsletter_*.html
          newsletter_*.txt
          item_cache.json
