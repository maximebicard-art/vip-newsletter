name: Weekly VIP Newsletter

on:
  schedule:
    # Run every Friday at 9:00 AM UTC
    - cron: '0 9 * * 5'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Debug secrets
      run: |
        echo "Checking GEMINI_API_KEY..."
        if [ -z "$GEMINI_API_KEY" ]; then
          echo "GEMINI_API_KEY is EMPTY or not set"
        else
          echo "GEMINI_API_KEY is set (length: ${#GEMINI_API_KEY})"
        fi
        echo "All env vars containing GEMINI:"
        env | grep -i gemini || echo "No GEMINI vars found"

    - name: Generate newsletter
      env:
        NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
        FROM_NAME: ${{ secrets.FROM_NAME }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        SENDER_NAME: ${{ secrets.SENDER_NAME }}
        SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
        COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
        COMPANY_ADDRESS: ${{ secrets.COMPANY_ADDRESS }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
        COMPANY_URL: ${{ secrets.COMPANY_URL }}
        CALENDAR_LINK: ${{ secrets.CALENDAR_LINK }}
        SEND_EMAIL: ${{ secrets.SEND_EMAIL }}
      run: |
        python auto_newsletter_v3.py

    - name: Upload generated newsletter
      uses: actions/upload-artifact@v4
      with:
        name: newsletter-${{ github.run_id }}
        path: newsletter_*.html

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --staged --quiet || git commit -m "Auto-update: newsletter files [skip ci]"
        git push
