name: Weekly VIP Newsletter (v3.32)

# v3.32: The persistent item cache (item_cache.json) only helps if the job runs
# DAILY — otherwise nothing accumulates between the weekly sends and mid-week
# stories still roll out of the feeds before Friday. So we now:
#   • run every day at 09:00 UTC to FETCH + CACHE,
#   • restore/save the cache across runs via actions/cache (no repo commits),
#   • only SEND the email on Fridays (or on a manual run).

on:
  schedule:
    - cron: '0 9 * * *'      # daily 09:00 UTC — fetch + cache every day
  workflow_dispatch:

permissions:
  contents: read              # actions/cache needs no write permission

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # Restore the most recent item cache from a previous run. The exact key
    # (per run_id) never hits; the restore-keys prefix pulls the newest cache.
    - name: Restore item cache
      uses: actions/cache/restore@v4
      with:
        path: item_cache.json
        key: item-cache-${{ github.run_id }}
        restore-keys: |
          item-cache-

    # Send on Fridays (DOW=5) or whenever the workflow is run manually.
    - name: Decide whether to send
      id: send
      run: |
        DOW=$(date -u +%u)
        if [ "$DOW" = "5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "flag=1" >> "$GITHUB_OUTPUT"
          echo "Send day: yes"
        else
          echo "flag=0" >> "$GITHUB_OUTPUT"
          echo "Send day: no (fetch + cache only)"
        fi

    - name: Generate newsletter
      env:
        NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
        FROM_NAME: ${{ secrets.FROM_NAME }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        SENDER_NAME: ${{ secrets.SENDER_NAME }}
        SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
        COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
        COMPANY_ADDRESS: ${{ secrets.COMPANY_ADDRESS }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
        COMPANY_URL: ${{ secrets.COMPANY_URL }}
        CALENDAR_LINK: ${{ secrets.CALENDAR_LINK }}
        PREHEADER: ${{ secrets.PREHEADER }}
        # v3.32: send flag is computed (Friday or manual), not taken from secrets.
        SEND_EMAIL: ${{ steps.send.outputs.flag }}
        # v3.32: item cache (defaults are fine; shown here so they're tunable).
        ITEM_CACHE_PATH: item_cache.json
        CACHE_RETENTION_DAYS: '10'
        DEBUG_NEWSLETTER: '1'
      run: |
        python auto_newsletter_v3.32.py

    # Persist the updated cache for the next run (even if a later step fails).
    - name: Save item cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: item_cache.json
        key: item-cache-${{ github.run_id }}

    - name: Upload generated newsletter
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newsletter-${{ github.run_id }}
        path: |
          newsletter_*.html
          newsletter_*.txt
          item_cache.json
