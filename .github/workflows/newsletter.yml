name: VIP Newsletter (v3.33)

# v3.33 (hardened): Poll every 2 HOURS, send once a week.
#
# Why 2-hourly: WWD / WWD Beauty / Drapers / THR expose only 10 items each. At
# WWD's volume that buffer turns over in ~3h, so a daily run could only capture
# ~25% of its output (measured). Polling every 2h stays inside that window; the
# persistent item cache accumulates everything between sends.
#
# HARDENING (after GitHub runner-acquisition failures):
#  • Cron runs at :23, NOT :00. The top of the hour is the most congested slot
#    on GitHub's scheduler and the most likely to be delayed or dropped.
#  • The send no longer requires an EXACT hour match. Scheduled runs are
#    best-effort and can be delayed or fail outright ("The job was not acquired
#    by Runner of type hosted..."). Previously a delayed Friday 09:00 run meant
#    NO newsletter that week, silently. Now we send on the FIRST Friday run at
#    or after 09:00 UTC, guarded by a last-sent-week marker so it still fires
#    exactly once per week. A failed run just sends 2 hours later instead.
#
# Cost: ~12 runs/day x ~1.5 min ~= 540 min/month — inside GitHub's 2,000-min
# free tier for private repos. If minutes get tight, '23 */3 * * *' is cheaper.

on:
  schedule:
    - cron: '23 */2 * * *'    # every 2 hours, offset off the congested :00 slot
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send the newsletter even if already sent this week'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vip-newsletter
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    # Restores item_cache.json AND last_send.txt (the once-per-week marker).
    - name: Restore state
      uses: actions/cache/restore@v4
      with:
        path: |
          item_cache.json
          last_send.txt
        key: vip-state-${{ github.run_id }}
        restore-keys: |
          vip-state-

    - name: Decide whether to send
      id: send
      run: |
        DOW=$(date -u +%u)          # 5 = Friday
        HOUR=$(date -u +%H)
        WEEK=$(date -u +%G-W%V)     # ISO year-week, e.g. 2026-W32
        LAST=$(cat last_send.txt 2>/dev/null || echo "none")
        echo "week=$WEEK" >> "$GITHUB_OUTPUT"
        echo "UTC now: DOW=$DOW HOUR=$HOUR WEEK=$WEEK | last sent: $LAST"

        if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
           && [ "${{ inputs.force_send }}" = "true" ]; then
          echo "flag=1" >> "$GITHUB_OUTPUT"; echo "-> SEND (manual)"
        elif [ "$WEEK" = "$LAST" ]; then
          echo "flag=0" >> "$GITHUB_OUTPUT"; echo "-> fetch only (already sent $WEEK)"
        elif [ "$DOW" -eq 5 ] && [ "$HOUR" -ge 09 ]; then
          # First Friday run at/after 09:00 UTC that hasn't sent this week.
          # Tolerates delayed or failed earlier runs instead of skipping a week.
          echo "flag=1" >> "$GITHUB_OUTPUT"; echo "-> SEND (first eligible Friday run)"
        elif [ "$DOW" -gt 5 ]; then
          # Safety net: Friday was missed entirely (outage all day). Send on the
          # weekend rather than lose the issue.
          echo "flag=1" >> "$GITHUB_OUTPUT"; echo "-> SEND (catch-up, Friday missed)"
        else
          echo "flag=0" >> "$GITHUB_OUTPUT"; echo "-> fetch + cache only"
        fi

    - name: Generate newsletter
      env:
        NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
        FROM_NAME: ${{ secrets.FROM_NAME }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        SENDER_NAME: ${{ secrets.SENDER_NAME }}
        SENDER_TITLE: ${{ secrets.SENDER_TITLE }}
        COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
        COMPANY_ADDRESS: ${{ secrets.COMPANY_ADDRESS }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PHONE: ${{ secrets.SENDER_PHONE }}
        COMPANY_URL: ${{ secrets.COMPANY_URL }}
        CALENDAR_LINK: ${{ secrets.CALENDAR_LINK }}
        PREHEADER: ${{ secrets.PREHEADER }}
        SEND_EMAIL: ${{ steps.send.outputs.flag }}
        ITEM_CACHE_PATH: item_cache.json
        CACHE_RETENTION_DAYS: '10'
        SOFT_RESERVE_PCT: '0.30'
        DEBUG_NEWSLETTER: '1'
      run: |
        python auto_newsletter_v3.34.py

    # Marker is written ONLY after the send step succeeds, so a failed send
    # retries on the next run instead of being recorded as delivered.
    - name: Record successful send
      if: success() && steps.send.outputs.flag == '1'
      run: echo "${{ steps.send.outputs.week }}" > last_send.txt

    - name: Save state
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          item_cache.json
          last_send.txt
        key: vip-state-${{ github.run_id }}

    - name: Upload generated newsletter
      if: steps.send.outputs.flag == '1'
      uses: actions/upload-artifact@v4
      with:
        name: newsletter-${{ github.run_id }}
        path: |
          newsletter_*.html
          newsletter_*.txt
          item_cache.json
